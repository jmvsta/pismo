spring:
  application:
    name: back
  flyway:
    locations: classpath:db/migration
  jooq:
    sql-dialect: postgres

logging:
  pattern:
    # requestId ties together every line of one HTTP request (also returned to the client in the
    # X-Request-Id response header); userId is the authenticated account, empty when anonymous.
    level: "%5p [req=%X{requestId:-} user=%X{userId:-}]"
  level:
    # INFO everywhere by default. Set LOGGING_LEVEL_COM_JVMVSTV_V_BACK=DEBUG to turn on per-call
    # service/repository tracing (see CallTraceAspect) without a code change.
    com.jvmvstv_v.back: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  email-verification:
    # Off by default so any environment without an explicit override (in particular local
    # dev, which has no real mail server) isn't locked out by an unconfirmed email. prod
    # turns this on explicitly.
    enforced: false
