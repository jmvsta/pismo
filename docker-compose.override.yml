# Auto-loaded by `docker compose` only when run with no explicit -f flags (plain local
# dev). Prod runs `docker compose -f docker-compose.yml -f docker-compose.prod.yml`,
# which does NOT pick this file up -- so this never reaches the VPS.
services:
  front:
    volumes:
      # prod's nginx.conf requires Let's Encrypt certs that don't exist locally --
      # swap in a plain-HTTP conf for local dev.
      - ./front/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
