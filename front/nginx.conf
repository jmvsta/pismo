server {
    listen 80;
    server_name pismonadar.com;

    # Let's Encrypt HTTP-01 challenge -- also used by the cron renewal job, so this has
    # to keep working on port 80 even though everything else now redirects to https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pismonadar.com;

    ssl_certificate     /etc/letsencrypt/live/pismonadar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pismonadar.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # forum posts can carry photos
    client_max_body_size 10m;

    # SPA: deep links and refreshes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets are safe to cache forever...
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ...index.html must not be
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # everything under /api goes to Spring Boot ("app" = compose service name).
    # the trailing slash on proxy_pass strips the /api prefix: /api/graphql -> /graphql
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # if the online chat later moves to websockets, also enable:
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # Google OAuth2 login: full-page browser redirects (not XHR/fetch), so these are
    # deliberately NOT under /api -- proxied 1:1 with no prefix stripped, so Spring's own
    # {baseUrl}/login/oauth2/code/{registrationId} redirect-uri resolves correctly. $scheme
    # here is now "https", which is what makes Spring generate an https redirect-uri.
    location /oauth2/ {
        proxy_pass http://app:8080/oauth2/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://app:8080/login/oauth2/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
