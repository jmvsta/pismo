server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # forum posts can carry photos
    client_max_body_size 10m;

    # Let's Encrypt HTTP-01 challenge -- certbot writes the token here (shared volume),
    # nginx just has to serve it back over plain HTTP. Needs to resolve before / does.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA: deep links and refreshes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets are safe to cache forever...
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ...index.html must not be
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # everything under /api goes to Spring Boot ("app" = compose service name).
    # the trailing slash on proxy_pass strips the /api prefix: /api/graphql -> /graphql
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # if the online chat later moves to websockets, also enable:
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # Google OAuth2 login: full-page browser redirects (not XHR/fetch), so these are
    # deliberately NOT under /api -- proxied 1:1 with no prefix stripped, so Spring's own
    # {baseUrl}/login/oauth2/code/{registrationId} redirect-uri resolves correctly without
    # needing X-Forwarded-Prefix.
    location /oauth2/ {
        proxy_pass http://app:8080/oauth2/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://app:8080/login/oauth2/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
