services:
  postgres:
    environment:
      POSTGRES_DB: ${DB_NAME:-pismo}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  app:
    image: ghcr.io/jmvsta/pismo/back:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pismo}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    restart: unless-stopped

  front:
    image: ghcr.io/jmvsta/pismo/front:latest
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro

  # No entrypoint/command override here on purpose -- this service exists only to be
  # invoked via `docker compose run --rm certbot <args>`, which keeps the image's own
  # ENTRYPOINT (the certbot binary) and just replaces the arguments. Renewal runs via a
  # cron job on the host (see the phase-1 PR description for the crontab line), not a
  # persistent container -- an earlier entrypoint override for that broke one-off runs.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  certbot-www:
  certbot-conf:
